name: 투자노트 자동 갱신

on:
  schedule:
    - cron: "20 23 * * 0-4"   # 평일 08:20 KST
    - cron: "50 6 * * 1-5"    # 평일 15:50 KST
    - cron: "0 9 * * 1-5"     # 평일 18:00 KST
    - cron: "30 11 * * 1-5"   # 평일 20:30 KST
  workflow_dispatch: {}
  push:
    paths:
      - "**.pdf"
      - "notes/**"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 시세·수급
        run: python update_market.py
        continue-on-error: true
      - name: DART 실적 공시·리포트
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python update_dart.py
        continue-on-error: true
      - name: 증권사 리포트·목표주가
        run: python update_research.py
        continue-on-error: true
      - name: 브리핑·AI 노트 목록
        run: |
          python build_briefs.py
          python build_notes.py
      - name: 변경 내용 저장
        run: |
          git config user.name "invest-note-bot"
          git config user.email "invest-note-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
